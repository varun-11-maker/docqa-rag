<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocQ&A</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#0e1b26;--mut:#5d6b78;--line:#d6dde3;--ac:#0b6b63;--acs:#dff2ef;--warn:#8a4b00;--mark:#fff3a3}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0c1319;--card:#131d26;--ink:#e6edf3;--mut:#93a3b1;--line:#243341;--ac:#4cc9b8;--acs:#12332f;--warn:#e0a458;--mark:#3d3a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
@media(max-width:780px){.app{grid-template-columns:1fr;height:auto}}
aside{border-right:1px solid var(--line);padding:20px;background:var(--card);overflow:auto}
h1{font:600 20px Georgia,serif;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
#drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
#drop.over{border-color:var(--ac);background:var(--acs)}
.doc{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.doc small{display:block;color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.go{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:600}
button.ghost{font-size:12px;padding:4px 8px;color:var(--mut)}
main{display:flex;flex-direction:column;min-height:0;height:100%}
.toolbar{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px 0}
#log{flex:1;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:18px}
.q{align-self:flex-end;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;max-width:80%}
.a{max-width:760px}
.ans{font:17px/1.6 Georgia,serif;white-space:pre-wrap}
.c{display:inline-block;background:var(--acs);color:var(--ac);font:600 12px system-ui;border-radius:5px;padding:0 5px;margin:0 1px}
.ans-actions{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.src{border-left:3px solid var(--ac);background:var(--card);padding:8px 12px;margin-top:8px;font-size:13px;color:var(--mut);border-radius:0 8px 8px 0}
.src b{color:var(--ink)}
.src-body{margin:6px 0 0;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.src-body.open{-webkit-line-clamp:unset;display:block}
.src mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.meta{font-size:12px;color:var(--mut);margin-top:8px}.warn{color:var(--warn)}
.latency{font-size:11px;color:var(--mut);opacity:.75;margin-left:auto}
form{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--line);background:var(--card)}
input[type=text]{flex:1;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{color:var(--mut);margin:auto;text-align:center;max-width:380px}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>DocQ&amp;A</h1>
  <p class="sub">Answers from your own documents, with sources.</p>
  <div id="drop" tabindex="0" role="button">Drop PDF, TXT or MD files here, or click to browse</div>
  <input id="file" type="file" accept=".pdf,.txt,.md,.csv" multiple hidden>
  <div id="docs"></div>
  <div class="meta" id="status"></div>
</aside>
<main>
  <div class="toolbar"><button type="button" class="ghost" id="clear" title="Clear chat">Clear chat</button></div>
  <div id="log"><div class="empty" id="empty">Upload a document, then ask a question about it. Each answer cites the passages it used.</div></div>
  <form id="f"><input type="text" id="q" placeholder="Ask about your documents" autocomplete="off" aria-label="Question"><button class="go">Ask</button></form>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const passageLabel=n=>n===1?"1 passage":`${n} passages`;

async function api(path,opt){
  const r=await fetch(path,opt);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:(j.detail&&JSON.stringify(j.detail))||"Request failed");
  return j;
}

function sourceLabel(s){
  return s.page!=null?`${s.doc}, p. ${s.page}`:s.doc;
}

function bestSentence(answer,passage){
  const sentences=passage.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(Boolean);
  if(!sentences.length)return null;
  const stop=new Set("a an the and or but if in on of to for is are was were be this that it with as by from at".split(" "));
  const words=answer.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w&&!stop.has(w)&&w.length>2);
  if(!words.length)return sentences[0];
  let best=sentences[0],bestScore=-1;
  for(const s of sentences){
    const sw=new Set(s.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean));
    let score=0;for(const w of words)if(sw.has(w))score++;
    if(score>bestScore){bestScore=score;best=s;}
  }
  return bestScore>0?best:null;
}

function highlightPassage(answer,passage){
  const target=bestSentence(answer,passage);
  const safe=esc(passage);
  if(!target)return safe;
  const i=passage.indexOf(target);
  if(i<0)return safe;
  return esc(passage.slice(0,i))+`<mark>${esc(target)}</mark>`+esc(passage.slice(i+target.length));
}

let srcSeq=0;
function renderSource(s,i,answer){
  const id=`srcbody-${++srcSeq}`;
  const body=highlightPassage(answer,s.text);
  return `<div class="src" data-i="${i}">
    <b>${i+1}. ${esc(sourceLabel(s))}</b>
    <div class="src-body" id="${id}">${body}</div>
    <button type="button" class="ghost" data-toggle-src="${id}">Show more</button>
  </div>`;
}

function renderSources(sources,answer){
  if(!sources.length)return "";
  const cited=sources.map((s,i)=>({s,i})).filter(x=>x.s.cited);
  const extra=sources.map((s,i)=>({s,i})).filter(x=>!x.s.cited);
  let html=`<div class="src-list">${cited.map(x=>renderSource(x.s,x.i,answer)).join("")}</div>`;
  if(extra.length){
    const n=extra.length;
    html+=`<button type="button" class="ghost" data-more-src>Show ${n} more ${n===1?"passage":"passages"}</button>`;
    html+=`<div class="src-extra" hidden>${extra.map(x=>renderSource(x.s,x.i,answer)).join("")}</div>`;
  }
  return html;
}

async function loadDocs(){
  const d=await api("/api/documents");
  $("docs").innerHTML=d.length
    ?d.map(x=>`<div class="doc"><span>${esc(x.name)}<small>${passageLabel(x.chunks)}</small></span><button onclick="del('${x.id}')" aria-label="Remove ${esc(x.name)}">Remove</button></div>`).join("")
    :'<p class="meta">No documents yet.</p>';
  return d;
}

async function del(id){await api("/api/documents/"+id,{method:"DELETE"});loadDocs()}
window.del=del;

async function upload(files){
  if(!files.length)return;
  const fd=new FormData();
  [...files].forEach(f=>fd.append("files",f));
  $("status").textContent="Indexing…";
  try{
    await api("/api/documents",{method:"POST",body:fd});
    $("status").textContent="Ready.";
  }catch(e){$("status").textContent=e.message}
  loadDocs();
}

async function askQuestion(q){
  if(!q)return;
  const log=$("log");$("empty")?.remove();
  log.insertAdjacentHTML("beforeend",`<div class="q">${esc(q)}</div>`);
  const box=document.createElement("div");box.className="a";
  box.innerHTML='<div class="meta">Searching your documents…</div>';
  log.append(box);log.scrollTop=log.scrollHeight;
  try{
    const r=await api("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
    const ans=esc(r.answer).replace(/\[(\d+)\]/g,'<span class="c">$1</span>');
    const note=r.mode==="extractive"?'<span class="warn">No API key set: showing the closest passage instead of a written answer</span>':"";
    box.innerHTML=`
      <div class="ans">${ans}</div>
      <div class="ans-actions">
        <button type="button" class="ghost" data-copy>Copy</button>
        <button type="button" class="ghost" data-fb="up" title="Helpful">👍</button>
        <button type="button" class="ghost" data-fb="down" title="Not helpful">👎</button>
        <span class="latency" title="${r.latency_ms} ms">${r.latency_ms} ms</span>
      </div>
      ${note?`<div class="meta">${note}</div>`:""}
      ${renderSources(r.sources||[], r.answer||"")}`;
    box.dataset.question=q;
    box.dataset.answer=r.answer||"";
  }catch(err){
    box.innerHTML=`<div class="meta warn">${esc(err.message)}</div>`;
  }
  log.scrollTop=log.scrollHeight;
}

$("drop").onclick=()=>$("file").click();
$("drop").onkeydown=e=>{if(e.key==="Enter")$("file").click()};
$("file").onchange=e=>{upload(e.target.files);e.target.value=""};
["dragover","dragenter"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",e=>upload(e.dataTransfer.files));

$("f").onsubmit=async e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;$("q").value="";askQuestion(q)};
$("clear").onclick=()=>{
  $("log").innerHTML='<div class="empty" id="empty">Upload a document, then ask a question about it. Each answer cites the passages it used.</div>';
};

$("log").addEventListener("click",async e=>{
  const t=e.target;
  const box=t.closest(".a");
  if(!box)return;

  if(t.matches("[data-toggle-src]")){
    const id=t.getAttribute("data-toggle-src");
    const target=document.getElementById(id);
    if(!target)return;
    const open=target.classList.toggle("open");
    t.textContent=open?"Show less":"Show more";
    return;
  }

  if(t.matches("[data-more-src]")){
    const extra=box.querySelector(".src-extra");
    if(!extra)return;
    const showing=!extra.hidden;
    extra.hidden=showing;
    const n=extra.querySelectorAll(".src").length;
    t.textContent=showing?`Show ${n} more ${n===1?"passage":"passages"}`:"Hide extra passages";
    return;
  }

  if(t.matches("[data-copy]")){
    const text=box.dataset.answer||"";
    try{
      await navigator.clipboard.writeText(text);
      const prev=t.textContent;t.textContent="Copied";setTimeout(()=>t.textContent=prev,1200);
    }catch(_){t.textContent="Copy failed";}
    return;
  }

  if(t.matches("[data-fb]")){
    const rating=t.getAttribute("data-fb");
    try{
      await api("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        question:box.dataset.question||"",
        answer:box.dataset.answer||"",
        rating
      })});
      t.textContent=rating==="up"?"👍 Thanks":"👎 Thanks";
      t.disabled=true;
    }catch(err){t.title=err.message;}
  }
});

loadDocs();
</script>
</body>
</html>
